name: Publish

# Push a tag like v1.0.0 (matching package.json and server.json versions) to release to npm
# and the official MCP Registry. npm auth uses Trusted Publishing (OIDC): no token secret.
# Run manually (workflow_dispatch) to (re)publish the current version to the MCP Registry;
# an already published npm version is skipped.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm trusted publishing + provenance, MCP Registry GitHub OIDC login
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Check versions
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "$VERSION" = "$(node -p "require('./server.json').version")"
          if [ "$GITHUB_REF_TYPE" = tag ]; then test "${GITHUB_REF_NAME#v}" = "$VERSION"; fi
          if npm view "mcp-server-zenmoney@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - name: Publish to npm
        if: steps.version.outputs.published != 'true'
        run: npm publish --provenance --access public
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
