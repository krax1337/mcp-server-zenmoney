name: Publish

# Push a tag like v1.0.0 (matching package.json and server.json versions) to release.
# npm uses staged publishing over Trusted Publishing (OIDC, no token secret): this workflow
# stages the version, a maintainer approves it on npmjs.com (Staged Packages tab) with 2FA,
# then a manual run (workflow_dispatch) sees the version live, skips npm and publishes it to
# the official MCP Registry.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm trusted publishing + provenance, MCP Registry GitHub OIDC login
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Ensure npm supports staged publishing
        run: npm install -g npm@^11.15.0 && npm --version
      - run: npm ci
      - name: Check versions
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "$VERSION" = "$(node -p "require('./server.json').version")"
          if [ "$GITHUB_REF_TYPE" = tag ]; then test "${GITHUB_REF_NAME#v}" = "$VERSION"; fi
          if npm view "mcp-server-zenmoney@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - name: Stage on npm
        if: steps.version.outputs.published != 'true'
        run: |
          npm stage publish --provenance
          echo "Staged mcp-server-zenmoney. Approve it at https://www.npmjs.com/package/mcp-server-zenmoney (Staged Packages), then run this workflow manually to publish to the MCP Registry." >> "$GITHUB_STEP_SUMMARY"
      - name: Install mcp-publisher
        if: steps.version.outputs.published == 'true'
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - if: steps.version.outputs.published == 'true'
        run: ./mcp-publisher login github-oidc
      - if: steps.version.outputs.published == 'true'
        run: ./mcp-publisher publish
